<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Thai Tools · Original Fonts</title>
  <style>
    :root {
      --bg: #fffaf4;
      --text: #302820;
      --muted: #7a6f63;
      --line: rgba(88,63,35,.16);
      --card: rgba(255,255,255,.9);
      --shadow: 0 8px 22px rgba(74,45,18,.07);
      --shadow-hover: 0 14px 32px rgba(74,45,18,.11);
      --radius: 18px;
      --purple: #7c63c0;
      --purple-soft: #f0ecff;
      --purple-mid: #c4b5f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124,99,192,.13), transparent 36%),
        radial-gradient(circle at top right, rgba(242,163,93,.10), transparent 38%),
        linear-gradient(135deg, #fdfbff 0%, #fffdf8 55%, #fffaf4 100%);
      color: var(--text);
      line-height: 1.68;
      min-height: 100vh;
    }

    .wrap { max-width: 680px; margin: 0 auto; padding: 52px 20px 72px; }

    .eyebrow {
      font-size: 11px;
      font-weight: 720;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .eyebrow::before {
      content: "";
      width: 18px;
      height: 2px;
      background: var(--purple);
      border-radius: 2px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 860;
      letter-spacing: -.03em;
      line-height: 1.18;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: .95rem;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .private-card {
      background:
        linear-gradient(135deg, rgba(124,99,192,.10), rgba(242,163,93,.08)),
        var(--card);
      border: 1px solid var(--purple-mid);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      display: block;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .private-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .tag {
      display: inline-block;
      font-size: .72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 7px;
      background: var(--purple-soft);
      color: var(--purple);
      border: 1px solid var(--purple-mid);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 2px 0 4px;
    }

    .icon { font-size: 1.08rem; line-height: 1; }

    h2 {
      font-size: 1.05rem;
      font-weight: 820;
      letter-spacing: -.02em;
      margin: 0;
    }

    .private-card p {
      margin: 0;
      color: var(--muted);
      font-size: .86rem;
      line-height: 1.55;
    }

    .go {
      margin-top: 10px;
      display: inline-flex;
      font-size: .8rem;
      font-weight: 700;
      color: var(--purple);
    }

    .footer {
      margin-top: 42px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .8rem;
    }

    @media (max-width: 600px) {
      .wrap { padding: 34px 14px 56px; }
      h1 { font-size: 1.7rem; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="eyebrow">Original Fonts</div>
    <h1>原版字體 Thai Tools</h1>
    <p class="subtitle">保留原本字體設定的 Thai Sentence Collector 與 Thai Daily Vlog Journal。</p>

    <div class="tool-grid">
      <a class="private-card" href="./thai-vlog-journal-original-font.html">
        <span class="tag">Original Font</span>
        <div class="title-row">
          <div class="icon">🎥</div>
          <h2>Thai Daily Vlog Journal</h2>
        </div>
        <p>原版字體版本，功能與資料邏輯維持原本設定。</p>
        <span class="go">開啟 Vlog Journal →</span>
      </a>

      <a class="private-card" href="./thai-sentence-collector-original-font.html">
        <span class="tag">Original Font</span>
        <div class="title-row">
          <div class="icon">🌿</div>
          <h2>Thai Sentence Collector</h2>
        </div>
        <p>原版字體版本，功能與資料邏輯維持原本設定。</p>
        <span class="go">開啟 Sentence Collector →</span>
      </a>
    </div>

    <footer class="footer">Original font archive · Private</footer>
  </main>
</body>
</html>
